<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Medical Image Enhancement System</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0a0e17;
  color: #e2e8f0;
  text-align: center;
}

header {
  padding: 20px;
  background: #111827;
  border-bottom: 1px solid #1e2d45;
}

h1 {
  color: #00d4ff;
  margin: 0;
}

.container {
  padding: 20px;
  max-width: 1000px;
  margin: auto;
}

.btn {
  padding: 10px 15px;
  margin: 5px;
  border: 1px solid #00d4ff;
  background: transparent;
  color: #00d4ff;
  border-radius: 8px;
  cursor: pointer;
}

.btn:hover {
  background: #00d4ff22;
}

canvas {
  width: 350px;
  border-radius: 10px;
  border: 1px solid #1e2d45;
  margin: 10px;
}

.row {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 20px;
}
</style>
</head>

<body>

<header>
  <h1>Medical Image Enhancement System</h1>
  <p>Ali Hussein Allawi - Medical Physics | University of Al-Qadisiyah</p>
</header>

<div class="container">

  <button class="btn" onclick="generateXray()">Generate X-Ray</button>
  <input type="file" accept="image/*" onchange="uploadImage(event)">

  <div class="row">
    <div>
      <h3>Original</h3>
      <canvas id="original"></canvas>
    </div>

    <div>
      <h3>Processed</h3>
      <canvas id="processed"></canvas>
    </div>
  </div>

</div>

<script>
const orig = document.getElementById("original");
const proc = document.getElementById("processed");

function setupCanvas() {
  orig.width = proc.width = 384;
  orig.height = proc.height = 384;
}

/* ─── Synthetic X-Ray ─── */
function generateXray() {
  setupCanvas();
  const ctx = orig.getContext("2d");

  const img = ctx.createImageData(384, 384);

  for (let i = 0; i < img.data.length; i += 4) {
    let v = Math.random() * 255;
    img.data[i] = img.data[i+1] = img.data[i+2] = v;
    img.data[i+3] = 255;
  }

  ctx.putImageData(img, 0, 0);
  proc.getContext("2d").drawImage(orig, 0, 0);
}

/* ─── Upload Image ─── */
function uploadImage(e) {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();

  reader.onload = function(ev) {
    const img = new Image();

    img.onload = function() {
      setupCanvas();

      const ctx = orig.getContext("2d");
      ctx.drawImage(img, 0, 0, 384, 384);

      proc.getContext("2d").drawImage(orig, 0, 0);
    };

    img.src = ev.target.result;
  };

  reader.readAsDataURL(file);
}
</script>

</body>
</html>
