<!DOCTYPE html><html><head><meta charset=UTF-8><title>Medical Image Enhancement</title><style>body{font-family:Arial;text-align:center;padding:50px;background:#0a0e17;color:white}h1{color:#00d4ff}a{color:#00e676;font-size:18px;padding:12px 25px;border:2px solid #00e676;border-radius:8px;text-decoration:none}</style></head><body><h1>Medical Image Enhancement System</h1><p>Ali Hussein Allawi</p><p>Medical Physics - University of Al-Qadisiyah Iraq</p><br><a href=https://github.com/aly278155-sketch/Medical-Image-Enhancement>View on GitHub</a></body></html>
<input type="file" id="imageInput" accept="image/*">
<img id="preview" width="300" style="margin-top:20px;border-radius:10px;">
<script>
const input = document.getElementById("imageInput");
const preview = document.getElementById("preview");

input.addEventListener("change", function () {
    const file = this.files[0];

    if (file) {
        preview.src = URL.createObjectURL(file);
    }
});
</script>
